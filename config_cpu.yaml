# ============================================================
# LabelModifyFL CPU 快速验证配置 — 本地CPU跑通实验流程
# ============================================================
# --- 基础设定 ---
seed: 42
model: simplecnn               # lenet / simplecnn / resnet18 (CPU推荐 simplecnn)
dataset: cifar10
use_amp: false                  # CPU 关闭混合精度

# --- 联邦学习 (精简) ---
num_clients: 4                 # 客户端数 3-5
dirichlet_alpha: 0.5           # Non-IID 程度
batch_size: 32                 # CPU 减小 batch size
local_epochs: 1                # 本地轮数
lr: 0.01
momentum: 0.9
weight_decay: 0.0005
global_rounds: 20              # 全局轮数 5-10

# --- 数据加载 (CPU 优化) ---
num_workers: 0                 # CPU 单进程加载
pin_memory: false              # CPU 关闭固定内存

# --- 检测触发 ---
detection_interval: 2          # 每 2 轮触发一次余弦相似度检测 (轮数少则检测频繁些)

# --- 标签修改模拟 ---
legit_from: 5
legit_to: 7
mal_from: 3
mal_to: 8
mal_ratio: 0.25                # 4客户端 * 0.25 = 1个恶意客户端
legit_ratio: 0.25              # 4客户端 * 0.25 = 1个合法客户端
modify_ratio: 0.5

# --- 余弦相似度检测超参 ---
history_window: 10
cos_threshold: 0.68           # 余弦相似度阈值 (<0.68 即可疑，约 47°)
min_history: 3                # 最少历史轮数才开始检测
tau_loss: 2.0                 # 损失跳变阈值

# --- 遗忘超参 ---
unlearn_epochs: 12
unlearn_lr: 0.05
mask_topk_ratio: 0.1
p_c_clip_min: 0.0
p_c_clip_max: 1.0
trim_ratio: 0.2